name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Once, not per test cell: ruff and black give the same answer on every OS.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --python 3.13

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Black (format check)
        run: uv run black --check .

  test:
    runs-on: ${{ matrix.os }}
    # The suite runs in parallel (-n auto); the slowest cell, Windows, should
    # finish in a few minutes. A cell near this cap means the suite has grown
    # slow - fix the tests, don't raise the number.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        # Every Python on Linux, where a version difference shows up first and
        # cheapest; one each on the slow OSes, oldest and newest between them,
        # since an OS difference rarely depends on the interpreter version.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.11" }
          # DIAGNOSTIC (temporary): isolate what makes Windows slow.
          - { os: windows-latest, python-version: "3.11", probe: defender-off }
          - { os: windows-latest, python-version: "3.11", probe: temp-on-d }
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Probe - Defender real-time off
        if: matrix.probe == 'defender-off'
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Probe - temp on D
        if: matrix.probe == 'temp-on-d'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\tmp | Out-Null
          "TMP=D:\tmp" >> $env:GITHUB_ENV
          "TEMP=D:\tmp" >> $env:GITHUB_ENV

      - name: Pytest
        run: uv run pytest -m "not bench_embeddings" -n auto --durations=40

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  bench-embeddings:
    runs-on: ubuntu-latest
    # Retrieval scoring is pure arithmetic over SQLite + vectors, not OS- or
    # interpreter-specific, so this runs once rather than across the test
    # matrix - the matrix's job already covers whether fastembed installs
    # and imports cleanly on every OS/Python cell.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.13"

      - name: Sync dependencies
        run: uv sync --extra dev --python "3.13"

      - name: Cache fastembed model
        # fastembed's default cache_dir is tempfile.gettempdir()/fastembed_cache
        # (/tmp/fastembed_cache on this runner), not ~/.cache/fastembed - verified
        # against fastembed/common/utils.py, not assumed.
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5

      - name: Pytest (bench, real embeddings)
        run: uv run pytest -m bench_embeddings -v
